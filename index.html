<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Happy Birthday Ethan — a card from your teammates">
<title>Ethan Birthday Card</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600;1,9..144,900&family=Nunito:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: a folded card sitting on a tabletop; the cover lifts open on tap, confetti falls from above. */
:root{
  --table:#1f3a8a;          /* cobalt tabletop */
  --table-2:#2a4fb3;
  --paper:#fbf6ea;          /* warm card stock */
  --paper-edge:#e8dfc9;
  --ink:#1c1a17;
  --ink-soft:#5c574d;
  --accent:#ff7a3d;         /* marigold-coral */
  --accent-2:#ffd23f;       /* candle yellow */
  --mint:#5bd1b2;
  --display:"Fraunces",Georgia,"Songti SC","Noto Serif SC",serif;
  --body:"Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --table:#0f1b45; --table-2:#172a66;
    --paper:#f3ecdc; --paper-edge:#d9cfb6;
    --ink:#1c1a17; --ink-soft:#5c574d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --table:#0f1b45; --table-2:#172a66;
  --paper:#f3ecdc; --paper-edge:#d9cfb6;
  --ink:#1c1a17; --ink-soft:#5c574d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--table);
  background-image:
    radial-gradient(ellipse at 50% 0%, var(--table-2), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 14px);
  color:var(--ink);
  font-family:var(--body);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

.scene{
  width:min(100%,520px);
  perspective:1600px;
  position:relative;
}
.card{
  position:relative;
  aspect-ratio:3/4;
  max-width:100%;
  transform-style:preserve-3d;
}
.face{
  position:absolute;inset:0;
  background:var(--paper);
  border-radius:10px;
  box-shadow:0 1px 0 var(--paper-edge) inset, 0 30px 60px -20px rgba(0,0,0,.55);
  padding:clamp(22px,6%,40px);
  display:flex;flex-direction:column;
}
/* inside page (revealed) */
.inside{
  justify-content:space-between;
  background-image:repeating-linear-gradient(0deg, transparent 0 31px, rgba(28,26,23,.08) 31px 32px);
  background-origin:content-box;
  background-clip:content-box;
}
.inside .eyebrow{
  font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
  font-weight:700;
}
.inside h2{
  font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,6.5vw,2.3rem);
  line-height:1.05;margin:.3em 0 .5em;text-wrap:balance;
  font-variation-settings:"opsz" 144;
}
.inside p{margin:0 0 .9em;font-size:clamp(.95rem,3.4vw,1.08rem);line-height:2;max-width:34ch}
.inside .sign{
  font-family:var(--display);font-style:italic;font-weight:600;font-size:1.25rem;
  color:var(--accent);margin-top:auto;
}
.inside .en{color:var(--ink-soft);font-size:.9rem;line-height:1.6}

/* cover: hinged on the left */
.cover{
  transform-origin:left center;
  transition:transform 1.4s cubic-bezier(.65,0,.2,1);
  backface-visibility:hidden;
  cursor:pointer;
  z-index:2;
  justify-content:flex-end;
  overflow:hidden;
  border:0;font:inherit;color:inherit;text-align:left;
}
.cover:focus-visible{outline:3px solid var(--accent-2);outline-offset:4px}
.card.open .cover{transform:rotateY(-168deg)}
.cover-back{
  position:absolute;inset:0;border-radius:10px;background:var(--paper-edge);
  transform:rotateY(180deg);backface-visibility:hidden;z-index:3;
  transform-origin:left center;
  transition:transform 1.4s cubic-bezier(.65,0,.2,1);
}
.card.open .cover-back{transform:rotateY(12deg)}

.cover .big{
  font-family:var(--display);
  font-weight:900;
  font-variation-settings:"opsz" 144;
  line-height:.86;
  letter-spacing:-.03em;
  font-size:clamp(3.4rem,19vw,6.6rem);
  color:var(--ink);
  text-wrap:balance;
  margin:0;
}
.cover .big em{font-style:italic;color:var(--accent);font-weight:600}
.cover .sub{
  margin:.8em 0 0;font-weight:700;color:var(--ink-soft);
  font-size:clamp(.85rem,3.2vw,1rem);letter-spacing:.08em;
}
.cover .date{
  position:absolute;top:clamp(18px,5%,30px);right:clamp(18px,5%,30px);
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
  font-weight:700;writing-mode:vertical-rl;
}
.hint{
  position:absolute;left:clamp(22px,6%,40px);bottom:clamp(14px,4%,22px);
  font-size:.75rem;color:var(--ink-soft);display:flex;align-items:center;gap:.5em;
}
.hint::before{content:"";width:22px;height:1px;background:var(--accent)}

/* cake on cover */
.cake{
  position:absolute;top:clamp(26px,9%,56px);left:clamp(22px,6%,40px);
  width:clamp(120px,36%,190px);
}
.cake svg{width:100%;height:auto;display:block;overflow:visible}
.flame{transform-origin:50% 100%;animation:flicker 1.1s ease-in-out infinite alternate}
.flame:nth-of-type(2){animation-delay:-.35s}
.flame:nth-of-type(3){animation-delay:-.7s}
@keyframes flicker{from{transform:scaleY(1) rotate(-3deg)}to{transform:scaleY(1.18) rotate(4deg)}}

.tagline{
  margin:28px 0 0;color:rgba(255,255,255,.72);font-size:.85rem;letter-spacing:.04em;text-align:center;
}
@media (prefers-reduced-motion: reduce){
  .cover,.cover-back{transition-duration:.2s}
  .flame{animation:none}
}
</style>

</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="scene">
  <div class="card" id="card">
    <section class="face inside" aria-label="卡片内页">
      <div>
        <div class="eyebrow">To Ethan · 2026.10.26</div>
        <h2>Ethan，生日快乐！</h2>
        <p>谢谢你每天带来的好点子和好心情。有你在的项目，总是更顺、更有意思。</p>
        <p>愿新的一岁少一点 bug，多一点假期；少一点加班，多一点蛋糕。</p>
        <p class="en">Wishing you a year of green builds, short meetings, and long weekends. Happy birthday!</p>
      </div>
      <div class="sign">— 你的同事们</div>
    </section>
    <div class="cover-back" aria-hidden="true"></div>
    <button class="face cover" id="cover" type="button" aria-expanded="false" aria-controls="card">
      <div class="date">Oct 26</div>
      <div class="cake" aria-hidden="true">
        <svg viewBox="0 0 200 180">
          <!-- candles -->
          <g>
            <rect x="60" y="62" width="10" height="38" rx="3" fill="#ff7a3d"/>
            <rect x="95" y="52" width="10" height="48" rx="3" fill="#5bd1b2"/>
            <rect x="130" y="62" width="10" height="38" rx="3" fill="#ff7a3d"/>
            <path class="flame" d="M65 60c-7-8-7-16 0-24 7 8 7 16 0 24z" fill="#ffd23f"/>
            <path class="flame" d="M100 50c-7-8-7-16 0-24 7 8 7 16 0 24z" fill="#ffd23f"/>
            <path class="flame" d="M135 60c-7-8-7-16 0-24 7 8 7 16 0 24z" fill="#ffd23f"/>
          </g>
          <!-- top tier -->
          <rect x="40" y="98" width="120" height="34" rx="6" fill="#fff" stroke="#1c1a17" stroke-width="3"/>
          <path d="M40 112c10 12 20-12 30 0s20 12 30 0 20-12 30 0 20 12 30 0" fill="none" stroke="#ff7a3d" stroke-width="5" stroke-linecap="round"/>
          <!-- bottom tier -->
          <rect x="20" y="130" width="160" height="38" rx="6" fill="#fff" stroke="#1c1a17" stroke-width="3"/>
          <path d="M20 146c12 12 24-12 36 0s24 12 36 0 24-12 36 0 24 12 36 0 10-6 16 0" fill="none" stroke="#5bd1b2" stroke-width="5" stroke-linecap="round"/>
          <!-- plate -->
          <ellipse cx="100" cy="170" rx="92" ry="6" fill="#1c1a17"/>
        </svg>
      </div>
      <h1 class="big">Happy<br>Birthday<br><em>Ethan</em></h1>
      <p class="sub">生 日 快 乐</p>
      <span class="hint">点一下打开卡片</span>
    </button>
  </div>
</div>
<p class="tagline">卡片可以来回翻开 · 打开时有彩带</p>

<script>
(function(){
  var card=document.getElementById('card');
  var cover=document.getElementById('cover');
  var canvas=document.getElementById('confetti');
  var ctx=canvas.getContext('2d');
  var pieces=[], raf=null, dpr=Math.min(window.devicePixelRatio||1,2);
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var colors=['#ff7a3d','#ffd23f','#5bd1b2','#fbf6ea','#ff4f81'];

  function resize(){
    canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize(); addEventListener('resize',resize);

  function burst(){
    if(reduce) return;
    var n=160;
    for(var i=0;i<n;i++){
      pieces.push({
        x:innerWidth/2+(Math.random()-.5)*innerWidth*.4,
        y:-20-Math.random()*innerHeight*.3,
        vx:(Math.random()-.5)*3,
        vy:2+Math.random()*3,
        w:6+Math.random()*6, h:8+Math.random()*10,
        rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.25,
        c:colors[i%colors.length], life:1
      });
    }
    if(!raf) raf=requestAnimationFrame(tick);
  }
  function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for(var i=pieces.length-1;i>=0;i--){
      var p=pieces[i];
      p.x+=p.vx+Math.sin(p.y*.02)*.6; p.y+=p.vy; p.rot+=p.vr; p.vy+=.03;
      if(p.y>innerHeight+30){pieces.splice(i,1);continue;}
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    if(pieces.length){raf=requestAnimationFrame(tick);}else{raf=null;}
  }

  var opened=false;
  cover.addEventListener('click',function(){
    var open=card.classList.toggle('open');
    cover.setAttribute('aria-expanded',String(open));
    if(open){ setTimeout(burst, 500); }
  });
})();
</script>
</body>
</html>
